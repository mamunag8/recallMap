name: recallmap
description: "RecallMap: The Visual FSRS-6 Exam & PDF Flashcard Studio (Native iOS, Android & Offline WASM Web PWA)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  archive: ^3.6.1
  shared_preferences: ^2.2.3
  flutter_tts: 4.0.2
  file_picker: 8.0.5
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/demo/
    - assets/ocr_models/

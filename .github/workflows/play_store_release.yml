name: Build & Publish RecallMap to Google Play Store (.aab & .apk)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: false
        default: 'internal'

jobs:
  build-and-publish-android:
    name: Build Signed Play Store AAB & APK
    runs-on: ubuntu-latest
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout RecallMap Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.27.4 Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Bootstrap Clean Android/iOS/Web Platform Wrapper & Restore Custom Configs
        run: |
          mkdir -p /tmp/recallmap_bak
          cp -r lib /tmp/recallmap_bak/lib
          cp pubspec.yaml /tmp/recallmap_bak/pubspec.yaml
          cp android/settings.gradle /tmp/recallmap_bak/settings.gradle
          cp android/gradle.properties /tmp/recallmap_bak/gradle.properties
          cp android/app/build.gradle /tmp/recallmap_bak/app_build.gradle
          cp android/app/proguard-rules.pro /tmp/recallmap_bak/proguard-rules.pro
          if [ -f android/app/recallmap-upload-keystore.jks ]; then
            cp android/app/recallmap-upload-keystore.jks /tmp/recallmap_bak/recallmap-upload-keystore.jks
          fi
          cp android/app/src/main/AndroidManifest.xml /tmp/recallmap_bak/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/recallmap/app/MainActivity.kt /tmp/recallmap_bak/MainActivity.kt
          cp web/index.html /tmp/recallmap_bak/index.html
          cp web/manifest.json /tmp/recallmap_bak/manifest.json

          rm -rf android ios web lib pubspec.yaml pubspec.lock test
          flutter create --org com.recallmap --project-name recallmap --platforms=android,ios,web .

          rm -rf lib test android/app/src/main/kotlin/com/recallmap/recallmap
          cp -r /tmp/recallmap_bak/lib lib
          cp /tmp/recallmap_bak/pubspec.yaml pubspec.yaml
          cp /tmp/recallmap_bak/settings.gradle android/settings.gradle
          cp /tmp/recallmap_bak/gradle.properties android/gradle.properties
          cp /tmp/recallmap_bak/app_build.gradle android/app/build.gradle
          cp /tmp/recallmap_bak/proguard-rules.pro android/app/proguard-rules.pro
          if [ -f /tmp/recallmap_bak/recallmap-upload-keystore.jks ]; then
            cp /tmp/recallmap_bak/recallmap-upload-keystore.jks android/app/recallmap-upload-keystore.jks
          fi
          cp /tmp/recallmap_bak/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/recallmap/app
          cp /tmp/recallmap_bak/MainActivity.kt android/app/src/main/kotlin/com/recallmap/app/MainActivity.kt
          sed -i 's|gradle-.*-all.zip|gradle-8.7-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          cp /tmp/recallmap_bak/index.html web/index.html
          cp /tmp/recallmap_bak/manifest.json web/manifest.json

      - name: Install Dart & Flutter Dependencies
        run: flutter pub get

      - name: Configure Production Upload Keystore (Google Play App Signing)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Using repository secret UPLOAD_KEYSTORE_BASE64..."
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/recallmap-upload-keystore.jks
            STORE_PASS="${KEYSTORE_PASSWORD:-RecallMapStore2026!}"
            ALIAS_NAME="${KEY_ALIAS:-recallmap_upload}"
            KEY_PASS="${KEY_PASSWORD:-RecallMapStore2026!}"
          elif [ -f android/app/recallmap-upload-keystore.jks ]; then
            echo "Using committed production upload keystore..."
            STORE_PASS="RecallMapStore2026!"
            ALIAS_NAME="recallmap_upload"
            KEY_PASS="RecallMapStore2026!"
          else
            echo "Generating production upload keystore for Play Store App Signing..."
            STORE_PASS="RecallMapStore2026!"
            ALIAS_NAME="recallmap_upload"
            KEY_PASS="RecallMapStore2026!"
            keytool -genkey -v \
              -keystore android/app/recallmap-upload-keystore.jks \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=RecallMap Studio, OU=Mobile, O=RecallMap, L=Dhaka, S=Dhaka, C=BD"
          fi

          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=recallmap-upload-keystore.jks\n" "$STORE_PASS" "$KEY_PASS" "$ALIAS_NAME" > android/key.properties

      - name: Build Signed Google Play Store Android App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Build Signed Production Android APK (.apk)
        run: flutter build apk --release

      - name: Build Offline Web PWA
        run: flutter build web --release

      - name: Upload Signed Play Store AAB, APK & Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RecallMap-PlayStore-Release-Bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            android/app/recallmap-upload-keystore.jks
          retention-days: 90

      - name: Publish to Google Play Console (When Service Account Secret is Configured)
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.recallmap.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: play_store/whatsnew

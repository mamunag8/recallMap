plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.recallmap.app"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.recallmap.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resValue "string", "app_name", "RecallMap"
        resValue "string", "store_title", "RecallMap: FSRS & PDF Study"
        resValue "string", "store_subtitle", "Visual Spaced Repetition, Image Occlusion & Exam Map"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter {
    source '../..'
}
